<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kasir Toko Roti v7 (Online Firebase)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .item-row { border-bottom: 1px dashed #ccc; padding-bottom: 10px; margin-bottom: 10px; }
        .table-thumbnail { max-height: 60px; max-width: 60px; object-fit: cover; border-radius: 5px; cursor: pointer; border: 1px solid #ddd; }
        
        /* Styling untuk Header Toko */
        .shop-header-container { margin-bottom: 3rem !important; }
        .shop-logo-image { height: 140px; width: auto; max-width: 100%; object-fit: contain; }
        .shop-title-name { color: #5a3c26; font-size: 2.2rem; }
    </style>
    
    <!-- Memanggil Script Firebase versi Compat agar mudah digunakan -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>
    <div class="container mt-4 mb-5">
        
        <!-- SHOP HEADER -->
        <div class="text-center shop-header-container p-4 bg-white rounded shadow-sm border">
            <div class="d-flex flex-column align-items-center justify-content-center">
                <img src="WhatsApp Image 2026-07-21 at 19.49.58.jpeg" alt="Logo D'SweeTalk" class="shop-logo-image mb-3">
                <h1 class="shop-title-name fw-bold mb-0">D'SweeTalk Bakes & Cakes</h1>
            </div>
        </div>

        <h2 class="mb-4 mt-4 text-center text-primary fw-bold">Sistem Penjualan Toko Roti & Kue (Online)</h2>

        <!-- BAGIAN 1: FORM INPUT PESANAN -->
        <div class="card mb-4 border-primary">
            <div class="card-header bg-primary text-white fw-bold" id="formHeaderTitle">Input Pesanan Baru</div>
            <div class="card-body">
                <form id="orderForm">
                    <div class="row mb-3">
                        <div class="col-md-6 mb-2">
                            <label class="form-label fw-bold">Nama Customer</label>
                            <input type="text" class="form-control" id="custName" placeholder="Masukkan nama pelanggan" required>
                        </div>
                        <div class="col-md-6 mb-2">
                            <label class="form-label fw-bold">Tanggal Order</label>
                            <input type="date" class="form-control" id="orderDate" required>
                        </div>
                    </div>

                    <label class="form-label fw-bold">Daftar Produk yang Dipesan</label>
                    <div id="itemsContainer">
                        <div class="row item-row">
                            <div class="col-md-4 mb-2">
                                <label class="form-label small">Nama & Jenis Produk</label>
                                <select class="form-select product-select" onchange="toggleManual(this)" required>
                                    <option value="" disabled selected>Pilih Produk...</option>
                                    <optgroup label="Bread">
                                        <option value="Salt Bread Classic Original">Salt Bread Classic Original</option>
                                        <option value="Salt Bread Cheese Chruncy">Salt Bread Cheese Chruncy</option>
                                        <option value="Salt Bread Choco Chees">Salt Bread Choco Chees</option>
                                        <option value="Salt Bread Triple Choco">Salt Bread Triple Choco</option>
                                        <option value="Salt Bread Cream Cheese Garlic">Salt Bread Cream Cheese Garlic</option>
                                        <option value="Salt Bread Smoke Beef cheese melt">Salt Bread Smoke Beef cheese melt</option>
                                    </optgroup>
                                    <optgroup label="Cakes">
                                        <option value="Cookies">Cookies</option>
                                        <option value="Nastar">Nastar</option>
                                        <option value="Kastengels">Kastengels</option>
                                        <option value="Peanut Nuttela">Peanut Nuttela</option>
                                        <option value="Nuttela Cheese">Nuttela Cheese</option>
                                        <option value="Black Choco">Black Choco</option>
                                        <option value="Chui Kao So">Chui Kao So</option>
                                    </optgroup>
                                    <option value="manual" class="text-primary fw-bold">+ Input Manual / Produk Baru</option>
                                </select>
                                <input type="text" class="form-control mt-2 product-manual d-none" placeholder="Ketik nama produk baru...">
                            </div>
                            <div class="col-md-3 mb-2">
                                <label class="form-label small">Harga Satuan (Rp)</label>
                                <input type="number" class="form-control item-price" placeholder="Contoh: 15000" oninput="calcRow(this)" required>
                            </div>
                            <div class="col-md-2 mb-2">
                                <label class="form-label small">Jumlah (Qty)</label>
                                <input type="number" class="form-control item-qty" placeholder="0" min="1" oninput="calcRow(this)" required>
                            </div>
                            <div class="col-md-3 mb-2">
                                <label class="form-label small">Subtotal (Rp)</label>
                                <div class="d-flex">
                                    <input type="number" class="form-control item-subtotal bg-light" readonly>
                                    <button type="button" class="btn btn-danger ms-2" onclick="removeRow(this)">X</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button type="button" class="btn btn-outline-primary btn-sm mb-4 fw-bold" onclick="addRow()">
                        + Tambah Produk Lainnya
                    </button>
                    <hr>

                    <div class="row mb-4 align-items-end">
                        <div class="col-md-12 mb-2">
                            <label class="form-label fw-bold">Grand Total (Rp)</label>
                            <input type="text" class="form-control form-control-lg bg-light text-danger fw-bold text-end" id="grandTotal" value="0" readonly>
                        </div>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success flex-grow-1 fw-bold py-2" id="submitBtn">Simpan Pesanan</button>
                        <button type="button" class="btn btn-secondary d-none" id="cancelEditBtn" onclick="resetFormState()">Batal Edit</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- BAGIAN 2: TABEL STATUS -->
        <div class="card">
            <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center flex-wrap gap-2">
                <span>Daftar Status Pembuatan & Proses Kue <span class="badge bg-success" id="connectionStatus">Connected</span></span>
                <div>
                    <button class="btn btn-sm btn-danger me-2" onclick="clearAllData()">🗑️ Hapus Semua Data</button>
                    <button class="btn btn-sm btn-light fw-bold" onclick="printOrderTable()">🖨️ Print Daftar (PDF)</button>
                </div>
            </div>
            <div class="card-body overflow-auto">
                <table class="table table-bordered table-hover align-middle" id="orderTable">
                    <thead class="table-light">
                        <tr>
                            <th>No</th>
                            <th style="min-width: 120px;">Foto Produk</th>
                            <th>Customer & Tanggal</th>
                            <th>Detail Pesanan</th>
                            <th>Total Bayar</th>
                            <th>Status Pembuatan</th>
                            <th style="min-width: 180px;">Pembayaran (Metode & Status)</th>
                            <th class="text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data otomatis muncul dari Firebase -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- BAGIAN 3: LOGIC JAVASCRIPT & FIREBASE -->
    <script>
        // =========================================================================
        // PASTE FIREBASE CONFIG ANDA DI SINI
        // Ganti bagian di bawah ini dengan config yang Anda dapat dari Firebase
        // =========================================================================
     // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyCcc2qkjOoUODvPX6Qr4ws2d1ov82RWjSw",
  authDomain: "list-order-dsweetalk-bakes.firebaseapp.com",
  databaseURL: "https://list-order-dsweetalk-bakes-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "list-order-dsweetalk-bakes",
  storageBucket: "list-order-dsweetalk-bakes.firebasestorage.app",
  messagingSenderId: "911158713830",
  appId: "1:911158713830:web:268180c59b3cd2ac2b0a27"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
        // =========================================================================

        // Inisialisasi Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const ordersRef = db.ref('bakery_orders');

        let orders = [];
        let editingId = null; 

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('orderDate').valueAsDate = new Date();
            
            // MENDENGARKAN PERUBAHAN DATA SECARA REAL-TIME DARI FIREBASE
            ordersRef.on('value', (snapshot) => {
                orders = [];
                snapshot.forEach((childSnapshot) => {
                    let order = childSnapshot.val();
                    order.id = childSnapshot.key; // Menggunakan Firebase Key sebagai ID
                    orders.push(order);
                });
                renderTable(); 
            });
        });

        function uploadTablePhoto(event, id) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    // Update langsung ke Firebase
                    db.ref('bakery_orders/' + id).update({ photo: e.target.result });
                }
                reader.readAsDataURL(file);
            }
        }

        function toggleManual(selectElement) {
            const manualInput = selectElement.parentElement.querySelector('.product-manual');
            if (selectElement.value === 'manual') {
                manualInput.classList.remove('d-none');
                manualInput.setAttribute('required', 'true');
            } else {
                manualInput.classList.add('d-none');
                manualInput.removeAttribute('required');
                manualInput.value = '';
            }
        }

        function addRow(productData = null) {
            const container = document.getElementById("itemsContainer");
            const firstRow = container.querySelector('.item-row');
            const newRow = firstRow.cloneNode(true);
            
            const select = newRow.querySelector('.product-select');
            const manualInput = newRow.querySelector('.product-manual');
            const priceInput = newRow.querySelector('.item-price');
            const qtyInput = newRow.querySelector('.item-qty');
            const subtotalInput = newRow.querySelector('.item-subtotal');

            if (productData) {
                let optionExists = Array.from(select.options).some(opt => opt.value === productData.productName);
                if (optionExists) {
                    select.value = productData.productName;
                    manualInput.classList.add('d-none');
                } else {
                    select.value = 'manual';
                    manualInput.classList.remove('d-none');
                    manualInput.value = productData.productName;
                }
                priceInput.value = productData.price;
                qtyInput.value = productData.qty;
                subtotalInput.value = productData.subtotal;
            } else {
                select.value = '';
                manualInput.value = '';
                manualInput.classList.add('d-none');
                priceInput.value = '';
                qtyInput.value = '';
                subtotalInput.value = '';
            }
            container.appendChild(newRow);
        }

        function removeRow(btn) {
            const rows = document.querySelectorAll('.item-row');
            if (rows.length > 1) {
                btn.closest('.item-row').remove();
                calcGrandTotal();
            } else {
                alert("Pesanan minimal harus ada 1 produk!");
            }
        }

        function calcRow(inputElement) {
            const row = inputElement.closest('.item-row');
            const price = parseFloat(row.querySelector('.item-price').value) || 0;
            const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
            row.querySelector('.item-subtotal').value = price * qty;
            calcGrandTotal();
        }

        function calcGrandTotal() {
            let total = 0;
            document.querySelectorAll('.item-subtotal').forEach(sub => {
                total += parseFloat(sub.value) || 0;
            });
            document.getElementById("grandTotal").value = total.toLocaleString('id-ID');
            document.getElementById("grandTotal").setAttribute('data-value', total);
        }

        document.getElementById("orderForm").addEventListener("submit", function(e) {
            e.preventDefault(); 
            
            const custName = document.getElementById("custName").value;
            const orderDate = document.getElementById("orderDate").value;
            const grandTotal = document.getElementById("grandTotal").getAttribute('data-value') || 0;
            
            let items = [];
            document.querySelectorAll('.item-row').forEach(row => {
                let selectVal = row.querySelector('.product-select').value;
                let productName = selectVal === 'manual' ? row.querySelector('.product-manual').value : selectVal;
                let price = row.querySelector('.item-price').value;
                let qty = row.querySelector('.item-qty').value;
                let subtotal = row.querySelector('.item-subtotal').value;

                if(productName && qty > 0) items.push({ productName, price, qty, subtotal });
            });

            if(items.length === 0) return alert("Pastikan produk sudah diisi!");

            if (editingId !== null) {
                // UPDATE DATA KE FIREBASE
                db.ref('bakery_orders/' + editingId).update({
                    custName: custName,
                    orderDate: orderDate,
                    grandTotal: grandTotal,
                    items: items
                });
                alert("Pesanan berhasil diperbarui!");
                resetFormState();
            } else {
                // SIMPAN DATA BARU KE FIREBASE
                const newOrderRef = ordersRef.push(); // Generate ID unik dari Firebase
                newOrderRef.set({
                    orderDate: orderDate,
                    custName: custName,
                    items: items,
                    grandTotal: grandTotal,
                    paymentMethod: "",
                    paymentDetail: "",
                    payStatus: "Belum Bayar",
                    statusPembuatan: "Masih Proses",
                    photo: "" 
                });
                
                this.reset();
                document.getElementById('orderDate').valueAsDate = new Date();
                document.getElementById("grandTotal").value = "0";
                
                const container = document.getElementById("itemsContainer");
                while (container.children.length > 1) container.removeChild(container.lastChild);
                container.querySelector('.product-manual').classList.add('d-none');
            }
        });

        function editOrder(id) {
            const order = orders.find(o => o.id === id);
            if (!order) return;

            editingId = id;
            document.getElementById("formHeaderTitle").innerText = "Edit Pesanan (Mode Edit)";
            document.getElementById("submitBtn").innerText = "Update Pesanan";
            document.getElementById("submitBtn").classList.remove("btn-success");
            document.getElementById("submitBtn").classList.add("btn-warning");
            document.getElementById("cancelEditBtn").classList.remove("d-none");

            document.getElementById("custName").value = order.custName;
            document.getElementById("orderDate").value = order.orderDate;

            const container = document.getElementById("itemsContainer");
            container.innerHTML = "";
            order.items.forEach(item => {
                addRow(item);
            });

            calcGrandTotal();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetFormState() {
            editingId = null;
            document.getElementById("formHeaderTitle").innerText = "Input Pesanan Baru";
            document.getElementById("submitBtn").innerText = "Simpan Pesanan";
            document.getElementById("submitBtn").classList.remove("btn-warning");
            document.getElementById("submitBtn").classList.add("btn-success");
            document.getElementById("cancelEditBtn").classList.add("d-none");
            
            document.getElementById("orderForm").reset();
            document.getElementById('orderDate').valueAsDate = new Date();
            document.getElementById("grandTotal").value = "0";

            const container = document.getElementById("itemsContainer");
            container.innerHTML = "";
            addRow(); 
        }

        // FUNGSI UPDATE STATUS LANGSUNG KE FIREBASE
        function updateStatus(id, newStatus) {
            db.ref('bakery_orders/' + id).update({ statusPembuatan: newStatus });
        }

        function updatePayStatus(id, newPayStatus) {
            db.ref('bakery_orders/' + id).update({ payStatus: newPayStatus });
        }

        function updatePayMethod(id, method) {
            db.ref('bakery_orders/' + id).update({ paymentMethod: method });
        }

        function updatePayDetail(id, detail) {
            db.ref('bakery_orders/' + id).update({ paymentDetail: detail });
        }

        function clearAllData() {
            if(confirm("AWAS! Apakah Anda yakin ingin menghapus seluruh riwayat pesanan dari Database Utama?")) {
                ordersRef.remove();
            }
        }

        // TAMPILKAN TABEL
        function renderTable() {
            const tbody = document.querySelector("#orderTable tbody");
            tbody.innerHTML = "";

            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted py-3">Belum ada data pesanan tersimpan di Database.</td></tr>`;
                return;
            }

            orders.forEach((order, index) => {
                const formattedTotal = parseInt(order.grandTotal).toLocaleString('id-ID');
                
                let productListHTML = '<ul class="mb-0 ps-3 small">';
                if(order.items) {
                    order.items.forEach(item => {
                        productListHTML += `<li>${item.qty}x ${item.productName}</li>`;
                    });
                }
                productListHTML += '</ul>';

                // Setup Foto Column
                let imgHTML = '';
                if (order.photo) {
                    imgHTML = `<img src="${order.photo}" class="table-thumbnail d-block mx-auto mb-1" onclick="window.open('${order.photo}', '_blank')">`;
                    imgHTML += `<label class="btn btn-sm btn-outline-secondary p-0 px-1 w-100 mt-1" style="font-size: 10px;">Ganti Foto<input type="file" class="d-none" accept="image/*" capture="environment" onchange="uploadTablePhoto(event, '${order.id}')"></label>`;
                } else {
                    imgHTML = `<label class="btn btn-sm btn-outline-primary w-100" style="font-size: 11px;">+ Upload<input type="file" class="d-none" accept="image/*" capture="environment" onchange="uploadTablePhoto(event, '${order.id}')"></label>`;
                }

                let formattedDate = order.orderDate ? order.orderDate.split('-').reverse().join('/') : '-';

                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td class="text-center align-middle">${imgHTML}</td>
                        <td>
                            <strong>${order.custName}</strong><br>
                            <small class="text-muted">📅 ${formattedDate}</small>
                        </td>
                        <td>${productListHTML}</td>
                        <td class="text-danger fw-bold">Rp ${formattedTotal}</td>
                        <td>
                            <select class="form-select form-select-sm" onchange="updateStatus('${order.id}', this.value)">
                                <option value="Masih Proses" ${order.statusPembuatan === 'Masih Proses' ? 'selected' : ''}>⏳ Masih Proses</option>
                                <option value="Sudah Jadi" ${order.statusPembuatan === 'Sudah Jadi' ? 'selected' : ''}>✅ Sudah Jadi</option>
                            </select>
                        </td>
                        <td>
                            <select class="form-select form-select-sm mb-1" onchange="updatePayStatus('${order.id}', this.value)">
                                <option value="Belum Bayar" ${order.payStatus === 'Belum Bayar' ? 'selected' : ''}>⏳ Belum Bayar</option>
                                <option value="Sudah Bayar" ${order.payStatus === 'Sudah Bayar' ? 'selected' : ''}>✅ Sudah Bayar</option>
                            </select>
                            <select class="form-select form-select-sm mb-1" onchange="updatePayMethod('${order.id}', this.value)">
                                <option value="" ${!order.paymentMethod ? 'selected' : ''}>Pilih Metode...</option>
                                <option value="Cash" ${order.paymentMethod === 'Cash' ? 'selected' : ''}>Cash</option>
                                <option value="Transfer Bank" ${order.paymentMethod === 'Transfer Bank' ? 'selected' : ''}>Transfer Bank</option>
                                <option value="QRIS" ${order.paymentMethod === 'QRIS' ? 'selected' : ''}>QRIS</option>
                            </select>
                            <input type="text" class="form-control form-control-sm" placeholder="Detail (Cth: BCA Budi)" value="${order.paymentDetail || ''}" onchange="updatePayDetail('${order.id}', this.value)">
                        </td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-warning mb-1 w-100" onclick="editOrder('${order.id}')">✏️ Edit</button>
                            <button class="btn btn-sm btn-danger w-100" onclick="printInvoice('${order.id}')">🖨️ Invoice</button>
                        </td>
                    </tr>
                `;
            });
        }

        // Print & Invoice Functions Tetap Sama...
        function printOrderTable() {
            if(orders.length === 0) return alert("Belum ada data pesanan untuk dicetak!");
            const printWindow = window.open('', '_blank');
            const dateStr = new Date().toLocaleString('id-ID');
            let tableRows = '';
            orders.forEach((order, index) => {
                let itemsList = order.items ? order.items.map(i => `${i.qty}x ${i.productName}`).join(', ') : '-';
                let detailPay = order.paymentDetail ? `(${order.paymentDetail})` : '';
                tableRows += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${order.custName} (${order.orderDate})</td>
                        <td>${itemsList}</td>
                        <td>Rp ${parseInt(order.grandTotal).toLocaleString('id-ID')}</td>
                        <td>${order.payStatus} - ${order.paymentMethod || '-'} ${detailPay}</td>
                        <td><strong>${order.statusPembuatan}</strong></td>
                    </tr>
                `;
            });
            const htmlDocument = `
                <html>
                <head><title>Daftar Pesanan - ${dateStr}</title><style>body { font-family: Arial, sans-serif; padding: 20px; } h2 { text-align: center; } table { width: 100%; border-collapse: collapse; margin-top: 20px; } th, td { border: 1px solid #000; padding: 8px; text-align: left; } th { background-color: #f2f2f2; }</style></head>
                <body><h2>Laporan Daftar Status Pembuatan & Pembayaran Toko Roti</h2><p>Dicetak pada: ${dateStr}</p><table><thead><tr><th>No</th><th>Customer & Tanggal</th><th>Pesanan</th><th>Total Bayar</th><th>Pembayaran</th><th>Status Produksi</th></tr></thead><tbody>${tableRows}</tbody></table><script>window.onload = function() { window.print(); }<\/script></body>
                </html>`;
            printWindow.document.write(htmlDocument);
            printWindow.document.close();
        }

        function printInvoice(id) {
            const order = orders.find(o => o.id === id);
            if(!order) return;
            const formattedTotal = parseInt(order.grandTotal).toLocaleString('id-ID');
            let itemsTableHTML = '';
            if(order.items) {
                order.items.forEach(item => {
                    let priceFmt = parseInt(item.price).toLocaleString('id-ID');
                    let subFmt = parseInt(item.subtotal).toLocaleString('id-ID');
                    itemsTableHTML += `<tr><td>${item.productName}</td><td>Rp ${priceFmt}</td><td>${item.qty}</td><td>Rp ${subFmt}</td></tr>`;
                });
            }
            let photoHTML = order.photo ? `<div style="text-align:center; margin-bottom:20px;"><img src="${order.photo}" style="max-width:200px; border:1px solid #ccc; padding:5px;"></div>` : '';
            let logoInvoice = `<div style="text-align:center; margin-bottom:15px;"><img src="WhatsApp Image 2026-07-21 at 19.49.58.jpeg" style="max-height:100px;"></div>`;
            let payDetailStr = order.paymentDetail ? `- ${order.paymentDetail}` : '';
            const printWindow = window.open('', '_blank');
            const invoiceHTML = `
                <html>
                <head><title>Invoice - ${order.custName}</title><style>body { font-family: 'Helvetica', Arial, sans-serif; padding: 40px; color: #333; max-width: 800px; margin: 0 auto; } .header { text-align: center; border-bottom: 2px solid #2c3e50; padding-bottom: 20px; margin-bottom: 30px; } .info-table { width: 100%; margin-bottom: 30px; } .info-table td { padding: 5px; } .item-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; } .item-table th, .item-table td { border: 1px solid #ddd; padding: 12px; text-align: left; } .item-table th { background-color: #f8f9fa; } .total-row { text-align: right; font-size: 1.2em; font-weight: bold; }</style></head>
                <body>
                    ${logoInvoice}
                    <div class="header"><h2>INVOICE TOKO ROTI & KUE</h2><p>Tanggal Order: ${order.orderDate}</p></div>
                    ${photoHTML}
                    <table class="info-table"><tr><td><strong>Nama Customer</strong></td><td>: ${order.custName}</td></tr><tr><td><strong>Status Pembayaran</strong></td><td>: ${order.payStatus} (${order.paymentMethod || '-'} ${payDetailStr})</td></tr><tr><td><strong>Status Produksi</strong></td><td>: ${order.statusPembuatan}</td></tr></table>
                    <table class="item-table"><thead><tr><th>Produk</th><th>Harga Satuan</th><th>Qty</th><th>Subtotal</th></tr></thead><tbody>${itemsTableHTML}</tbody></table>
                    <div class="total-row">TOTAL BAYAR: Rp ${formattedTotal}</div>
                    <script>window.onload = function() { window.print(); }<\/script>
                </body>
                </html>`;
            printWindow.document.write(invoiceHTML);
            printWindow.document.close();
        }
    </script>
</body>
</html>
